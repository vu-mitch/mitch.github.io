name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -a css js images research talks _site/
          cp demo_chatfeld_vier_situationen.mp4 _site/
          test -s _site/index.html
          test -s _site/css/site.css
          test -s _site/images/portrait.jpg
          test -s _site/images/video-poster.jpg
          test -s _site/demo_chatfeld_vier_situationen.mp4
          test -s _site/research/index.html
          test -s _site/talks/ai-engineer-nyc-compute-trading/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
